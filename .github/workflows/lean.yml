name: Lean

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true
      - name: Build semantic kernel
        run: lake build
      - name: Check semantic examples
        run: |
          lake env lean Semverifier/Tests/Identifier.lean
          lake env lean Semverifier/Tests/Version.lean
          lake env lean Semverifier/Tests/Parser.lean
          lake env lean Semverifier/Tests/Comparator.lean
          lake env lean Semverifier/Tests/ComparatorParser.lean
          lake env lean Semverifier/Tests/ComparatorSet.lean
          lake env lean Semverifier/Tests/ComparatorSetParser.lean
          lake env lean Semverifier/Tests/Range.lean
          lake env lean Semverifier/Tests/RangeAlgebra.lean
          lake env lean Semverifier/Tests/RangeIntersection.lean
          lake env lean Semverifier/Tests/Caret.lean
          lake env lean Semverifier/Tests/RangeCaret.lean
          lake env lean Semverifier/Tests/Tilde.lean
          lake env lean Semverifier/Tests/RangeTilde.lean
          lake env lean Semverifier/Tests/XRange.lean
          lake env lean Semverifier/Tests/RangeXRange.lean
          lake env lean Semverifier/Tests/HyphenRange.lean
          lake env lean Semverifier/Tests/RangeHyphenRange.lean

      - name: Check public intersection CLI
        run: |
          lake build semverifier
          witness="$(.lake/build/bin/semverifier intersect '1.2.3-alpha.2' '1.2.3-alpha.2 - 1.2.3')"
          test "$witness" = $'witness\t1.2.3-alpha.2'
          disjoint="$(.lake/build/bin/semverifier intersect '1.x' '2.x')"
          test "$disjoint" = "disjoint"
          if .lake/build/bin/semverifier intersect 'not-a-range' '1.x' >/tmp/semverifier-cli-out 2>/tmp/semverifier-cli-err; then
            echo "expected invalid range to fail"
            exit 1
          fi
          test ! -s /tmp/semverifier-cli-out
          grep -Fx $'parse-error\tleft\tnot-a-range' /tmp/semverifier-cli-err

      - name: Audit intersection boundary candidate coverage
        run: lake exe semverifierIntersectionCoverage
      - name: Install node-semver reference
        run: npm install --no-save --ignore-scripts semver@7.8.5
      - name: Differential conformance against node-semver
        run: node tools/conformance/node-semver.js
      - name: Concrete intersection witness probe
        run: node tools/conformance/node-semver-intersects.js

      - name: Install pinned current node-semver main
        run: npm install --no-save --ignore-scripts "git+https://github.com/npm/node-semver.git#6e05b7637396ac66522cff8731f07cfe0ef49a29"
      - name: Probe all Semverifier witnesses against current node-semver main
        run: node tools/conformance/node-semver-intersects.js
      - name: Audit current node-semver main intersection
        run: node tools/conformance/node-semver-current-main.js
      - name: Audit complete intersection matrix against current node-semver main
        run: node tools/conformance/node-semver-full-intersection-matrix.js
      - name: Compare node-semver intersection repair strategies
        run: node tools/conformance/node-semver-intersection-strategies.js
